plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// 发布签名配置从仓库外的 keystore.properties 读取；缺失时退回 debug 签名（仅本机测试）
def keystorePropsFile = rootProject.file('keystore.properties')
def hasReleaseSigning = keystorePropsFile.exists()
def keystoreProps = new Properties()
if (hasReleaseSigning) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
} else {
    logger.warn('keystore.properties 缺失：release 将退回 debug 签名，仅限本机测试，不能对外分发')
}

android {
    namespace 'com.hutb.timetable'
    compileSdk 36

    defaultConfig {
        applicationId "com.hutb.timetable"
        minSdk 24
        targetSdk 36
        versionCode 49
        versionName "1.0.48"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 调试期允许明文流量：教务系统为 http:// 访问
        }
        release {
            // 发给他人时必须开混淆与资源压缩；签名优先用独立 release keystore
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        // java.time 是 API 26+；minSdk 24 必须开启 desugaring，
        // 否则 API 24/25 设备一进设置页/切周次就 NoClassDefFoundError
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}', 'META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // 领域模型与课表解析（纯 JVM 模块）
    implementation project(':core')

    // minSdk 24 下的 java.time 支持（API 26+ 才有）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // 基础 + Compose
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    // HTML 解析（强智 jsxsd 课表页面为服务端渲染的 HTML 表格）
    // jsoup 由 :core 以 api 方式传递，此处无需重复声明

    // 凭据本地存储
    implementation 'androidx.security:security-crypto:1.1.0'

    // 真机 Compose UI 回归：矩阵替代列表、连堂课分割、免责声明确认
    androidTestImplementation platform('androidx.compose:compose-bom:2024.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    // Compose 测试传递的 Espresso 3.5 在 Android 13+ 会因 InputManager API 变化崩溃
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
